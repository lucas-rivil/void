name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Telecharger le bundle Tor expert
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-tor.ps1

      - name: Generer l'icone
        run: powershell -ExecutionPolicy Bypass -File scripts/make-icon.ps1

      - name: Installer les dependances
        run: npm install
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Void ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

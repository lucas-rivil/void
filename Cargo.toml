[workspace]
resolver = "2"
members = [
    "crates/void-crypto",
    "crates/void-proto",
    "crates/void-tor",
    "crates/void-store",
    "crates/void-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
void-crypto = { path = "crates/void-crypto" }
void-proto = { path = "crates/void-proto" }
void-tor = { path = "crates/void-tor" }
void-store = { path = "crates/void-store" }
void-core = { path = "crates/void-core" }
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
